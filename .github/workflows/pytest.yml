name: API tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dossier
          POSTGRES_PASSWORD: dossier_test
          POSTGRES_DB: dossier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dossier -d dossier_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      DOSSIER_GENERATION_WORKER_ENABLED: "0"
      CALENDAR_AUTOMATION_ENABLED: "0"
      DATABASE_URL: postgresql://dossier:dossier_test@localhost:5432/dossier_test
      JWT_SECRET: ci-test-jwt-secret-min-32-chars-long
      DATABASE_AUTO_CREATE_TABLES: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest tests/ -v --tb=short
